# Render Blueprint for the QuickLink backend API.
#
# IMPORTANT: If this service was created manually in the Render dashboard
# (rather than via this Blueprint), the dashboard settings are what actually
# apply. Make sure the dashboard matches this file:
#   Root Directory:     server
#   Build Command:      npm ci
#   Start Command:      npm start
#   Health Check Path:  /health
# The previous misconfiguration used `npm run dev` as the build command, which
# does not install dependencies and crashed with "Cannot find package 'express'".
services:
  - type: web
    name: quicklink-rwanda-school
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas connection string (set in the Render dashboard, never commit).
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      # Public QuickLink frontend origin.
      - key: CORS_ORIGIN
        value: https://quicklink.ishconnect.rw
      - key: APP_URL
        value: https://quicklink.ishconnect.rw
      # Cloudinary account credentials; set them in Render's environment.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER_PREFIX
        value: quicklink
      - key: OWNER_NAME
        value: QuickLink Owner
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: 'true'

  # Optional: only needed if you ever want Render to serve the frontend.
  # The live frontend is hosted on Vercel, so this service can be omitted.
  - type: web
    name: quicklink-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://quicklink-3eng.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
